function Btn({ children, variant = 'primary', size = 'md', icon, style = {}, onClick, className }) {
  const base = {

    gap: 8, fontFamily: T.sans, fontWeight: 700,
    border: 'none', cursor: 'pointer', borderRadius: 999,

    sm: { padding: '10px 18px', fontSize: 13 },
    md: { padding: '15px 22px', fontSize: 14 },
    lg: { padding: '18px 28px', fontSize: 15 },
  };
  const variants = {
    primary: { background: T.teal, color: '#fff', boxShadow: '0 4px 14px rgba(63,191,163,0.32)' },
    ghost:   { background: 'transparent', color: T.ink, border: `1.5px solid ${T.border}` },
    outline: { background: 'transparent', color: '#fff', border: '1.5px solid rgba(255,255,255,0.6)' },
    dark:    { background: T.ink, color: '#fff' },
    soft:    { background: T.tealSoft, color: T.tealDeep },
  };
  return (
    <button onClick={onClick} className={className} style={{
      ...base, ...sizes[size], ...variants[variant], ...style,
    }}>
      {icon}
      <span style={{ textTransform: 'uppercase', letterSpacing: 1.4, fontSize: sizes[size].fontSize - 1 }}>
        {children}

}

}

function Field({ label, value, placeholder, suffix, style = {} }) {
  return (
    <label style={{ display: 'block', ...style }}>
      <div style={{
        fontFamily: T.sans, fontSize: 11, fontWeight: 700,
        letterSpacing: 1.4, textTransform: 'uppercase',

        <span style={{ flex: 1 }}>{value || placeholder}</span>
        {suffix && <span style={{ color: T.muted, fontSize: 13 }}>{suffix}</span>}
      </div>

}

  const tones = {

    warn:  { bg: T.warnSoft, color: T.warn },
    muted: { bg: '#F1EEE6', color: T.body },

    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '5px 10px 5px 8px', borderRadius: 999,
      background: tones.bg, color: tones.color,
      fontFamily: T.sans, fontWeight: 700, fontSize: 11,
      letterSpacing: 1.1, textTransform: 'uppercase',
    }}>
      {icon}
      {children}
    </span>
  );
}

      width: size, height: size, borderRadius: '50%',
      background: tone === T.teal ? T.tealSoft : '#F1EEE6',
      color: tone, display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: T.serif, fontWeight: 600, fontSize: size * 0.4,

function WaitlistModal({ onClose }) {
  const [email, setEmail] = React.useState('');
  const [submitted, setSubmitted] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, []);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!email) return;
    setLoading(true);
    setError('');
    try {
      const res = await fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'Something went wrong');
      }
      setSubmitted(true);
    } catch (err) {
      setError(err.message || 'Something went wrong. Please try again.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 999,
        background: 'rgba(15,20,22,0.65)',
        backdropFilter: 'blur(6px)',
        WebkitBackdropFilter: 'blur(6px)',

              <ul style={{ listStyle: 'none', padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 11 }}>
                {c.links.map(l => (
                  <li key={l} style={{ fontFamily: T.sans, fontSize: 14, color: 'rgba(255,255,255,0.75)', cursor: 'pointer' }}>{l}</li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div style={{
          paddingTop: 28, borderTop: '1px solid rgba(255,255,255,0.10)',
          display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap',
          gap: 18, fontFamily: T.sans, fontSize: 12, color: 'rgba(255,255,255,0.5)',
        }}>
          <div>© {new Date().getFullYear()} Dzvin Care, Inc. &nbsp;·&nbsp; Made with care in Brooklyn &amp; Kyiv.</div>
          <div>Peace of mind for families.</div>
        </div>
      </div>
    </footer>
  );
}

}
